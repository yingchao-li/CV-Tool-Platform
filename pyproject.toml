[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvkit"
version = "1.0.0"
description = "A modular classical computer vision toolkit: geometry, computational photography, retrieval, detection and face analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yingchao Li" }]
keywords = ["computer-vision", "ransac", "hdr", "vlad", "selective-search", "face-recognition"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python>=4.8",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pillow>=10.0",
  "pandas>=2.0",
  "tqdm>=4.66",
  "joblib>=1.3",
  "rawpy>=0.19",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
faces = ["onnxruntime>=1.16", "mtcnn>=1.0"]
coco = ["pycocotools>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cvkit = "cvkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
